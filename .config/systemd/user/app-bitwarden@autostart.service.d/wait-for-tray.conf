# Drop-in for the unit auto-generated by systemd-xdg-autostart-generator from
# ~/.config/autostart/bitwarden.desktop.
#
# Why a drop-in rather than editing the .desktop:
# - Bitwarden's "Open at login" preference rewrites the .desktop file,
#   wiping any Exec line we set there.
# - Drop-ins live in ~/.config/systemd/user/<unit-name>.d/ and apply to the
#   unit by name, including transient generator.late/ units. They survive any
#   regeneration of the source .desktop.
#
# What this enforces:
# 1. Ordering: Bitwarden waits for org.kde.StatusNotifierWatcher to be owned
#    on the user bus before launching, via tray-watcher-ready.service. This
#    fixes the boot race where Bitwarden registered its SNI before the watcher
#    (qs -c noctalia-shell) existed and silently dropped its tray icon.
# 2. Flags: launches Bitwarden the way it needs to be launched on niri/Wayland:
#    - XDG_CURRENT_DESKTOP=Unity: makes Electron register via libappindicator
#      / org.kde.StatusNotifierItem instead of falling back to legacy XEmbed.
#    - --ozone-platform=wayland: native Wayland surface instead of XWayland.

[Unit]
After=tray-watcher-ready.service
Wants=tray-watcher-ready.service

[Service]
# Reset the auto-generated ExecStart, then set ours.
ExecStart=
ExecStart=/usr/bin/env XDG_CURRENT_DESKTOP=Unity /usr/bin/bitwarden-desktop --ozone-platform=wayland

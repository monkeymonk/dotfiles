set -g default-shell /usr/bin/zsh
set -gu default-command

# ── Terminal ───────────────────────────────────────────────
set -g default-terminal "xterm-ghostty"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours (tmux 3.0+)
set -g allow-passthrough all
set -ga update-environment "KITTY_WINDOW_ID"

# ── General ───────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g monitor-activity on
set -g visual-activity off
set -g exit-empty off
set -g exit-unattached off
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Window titles ─────────────────────────────────────────
set -g set-titles on
set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# ── Prefix ────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind-key -N "Utilities | Send prefix to a nested session" C-a send-prefix

# ── Sessions ──────────────────────────────────────────────
bind-key -N "Sessions | Create and switch to a new session" S command-prompt -p "New session:" "new-session -d -s '%1' \; switch-client -t '%1'"
bind-key -N "Sessions | Kill the current session (confirm)" Q confirm-before -p "Kill session #S? (y/n)" kill-session
bind-key -N "Sessions | Save session layout (tmuxp)" M-s display-popup -E -T "[ Save session ]" "~/.config/tmux/scripts/session_save.sh"
bind-key -N "Sessions | Load session layout (tmuxp)" M-l display-popup -E -T "[ Load session ]" "~/.config/tmux/scripts/session_load.sh"
bind-key -N "Sessions | Edit tmuxp session files" M-S display-popup -E -w 80% -h 80% -T "[ Edit sessions ]" "nvim ~/.tmuxp/"
bind-key -N "Sessions | List and switch sessions" s choose-tree -Zs
bind-key -N "Sessions | Rename the current session" '$' command-prompt -I "#S" "rename-session '%%'"
bind-key -N "Sessions | Previous session" ( switch-client -p
bind-key -N "Sessions | Next session" ) switch-client -n

# ── Windows ───────────────────────────────────────────────
bind-key -N "Windows | New window in the current path" -n M-T new-window -c "#{pane_current_path}"
bind-key -N "Navigation | Previous window" -n M-H previous-window
bind-key -N "Navigation | Next window" -n M-L next-window
bind-key -N "Windows | Move window left" -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind-key -N "Windows | Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1
bind-key -N "Windows | Kill window" d kill-window
bind-key -N "Windows | Kill window (confirm)" k confirm kill-window
bind-key -N "Windows | Move window to another session" M choose-tree -Zs "move-window -t '%%'"
bind-key -N "Windows | Create a new window" c new-window
bind-key -N "Windows | List and switch windows" w choose-tree -Zw
bind-key -N "Windows | Rename the current window" , command-prompt -I "#W" "rename-window '%%'"
bind-key -N "Windows | Break pane into a new window" ! break-pane

# ── Panes ─────────────────────────────────────────────────
unbind %
bind-key -N "Panes | Split pane to the right" v split-window -h -c "#{pane_current_path}"
unbind '"'
bind-key -N "Panes | Split pane below" - split-window -v -c "#{pane_current_path}"
bind-key -N "Panes | Join a pane from another window" J command-prompt -p "Join pane from window:" "join-pane -h -s ':%%'"
bind-key -N "Panes | Zoom the active pane" z resize-pane -Z
bind-key -N "Panes | Kill the active pane (confirm)" x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key -N "Panes | Swap pane up" \{ swap-pane -U
bind-key -N "Panes | Swap pane down" \} swap-pane -D
bind-key -N "Panes | Cycle to the next pane" o select-pane -t :.+
bind-key -N "Panes | Toggle to the last pane" \; last-pane
bind-key -N "Panes | Show pane numbers" q display-panes
bind-key -N "Panes | Mark the active pane" m select-pane -m
bind-key -r -N "Panes | Resize pane up" M-Up resize-pane -U 5
bind-key -r -N "Panes | Resize pane down" M-Down resize-pane -D 5
bind-key -r -N "Panes | Resize pane left" M-Left resize-pane -L 5
bind-key -r -N "Panes | Resize pane right" M-Right resize-pane -R 5

# ── Copy mode ─────────────────────────────────────────────
bind-key -N "Copy mode | Enter copy mode" [ copy-mode
bind-key -N "Copy mode | Paste the buffer" ] paste-buffer -p
bind-key -N "Copy mode | Choose from paste buffers" = choose-buffer -Z

# ── Configuration & help ──────────────────────────────────
bind-key -N "Configuration | Reload tmux configuration" r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded!'
bind-key -N "Help | Search active key bindings" h \
  display-popup -E -w 94% -h 86% -T " Tmux bindings " \
  "~/.config/tmux/scripts/cheatsheet.sh"
bind-key -N "Utilities | Kill the tmux server (confirm)" K confirm kill-server
bind-key -N "Utilities | Open the command prompt" : command-prompt

# ── Status bar auto-hide on zoom ──────────────────────────
set-hook -g after-resize-pane 'if -F "#{window_zoomed_flag}" "set status off" "set status on"'
bind-key -N "Utilities | Toggle the status bar" t set status

# ── Theme (Catppuccin) ────────────────────────────────────
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "basic"
run ~/.config/tmux/plugins/tmux/catppuccin.tmux
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#[range=user|wmx]#{E:@catppuccin_status_workmux}#[norange]"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# ── Plugins ───────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'f'
set -g @floax-width '80%'
set -g @floax-height '80%'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -ag status-right "#{prefix_highlight}"
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'red'
set -g @prefix_highlight_prefix_prompt 'Wait'
set -g @prefix_highlight_copy_prompt 'Copy'
set -g @prefix_highlight_sync_prompt 'Sync'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-pre-pane-process 'tmux switch-client -n && tmux kill-session -t=resurrect'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ── Agents (Workmux) ──────────────────────────────────────
# Agent monitoring handled by workmux (standalone CLI, not a tpm plugin).
# Config: ~/.config/workmux/config.yaml  ·  https://github.com/raine/workmux
#
# Status-bar segment: global agent counts (▲ waiting · ● working · ✓ done),
# clickable to open the dashboard (see MouseDown1Status below).
#
# Built like a catppuccin status module so it tracks @catppuccin_flavor, but
# assembled here rather than via utils/status_module.conf: that helper needs a
# %hidden MODULE_NAME, which does not survive the source when catppuccin is
# still loading from its own asynchronous `run`. Every reference stays lazy
# (#{E:...}), so the segment resolves at draw time, whatever the load order.
set -ogq @catppuccin_workmux_icon "󰚩 "
set -ogq @catppuccin_workmux_color "#{E:@thm_mauve}"
set -ogq @catppuccin_workmux_text " #(~/.config/tmux/scripts/workmux_status.sh)"
set -gq  @_wmx_connect "#{?#{==:#{E:@catppuccin_status_connect_separator},yes},,#[bg=default]}"
set -g   @catppuccin_status_workmux "#[fg=#{E:@catppuccin_workmux_color}]#{E:@_wmx_connect}#{E:@catppuccin_status_left_separator}"
set -ag  @catppuccin_status_workmux "#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_workmux_color}]#{E:@catppuccin_workmux_icon}"
set -ag  @catppuccin_status_workmux "#{E:@catppuccin_status_middle_separator}"
set -ag  @catppuccin_status_workmux "#[fg=#{E:@thm_fg},bg=#{E:@catppuccin_status_module_text_bg}]#{E:@catppuccin_workmux_text}"
set -ag  @catppuccin_status_workmux "#[fg=#{E:@catppuccin_status_module_text_bg}]#{E:@_wmx_connect}#{E:@catppuccin_status_right_separator}"

# Left-click the segment -> toggle the dashboard. Any other status click keeps
# tmux's default behaviour (switch to the clicked window/session).
bind-key -N "Workmux | Toggle the agent dashboard (click the status segment)" -n MouseDown1Status \
  if-shell -F '#{==:#{mouse_status_range},wmx}' \
    { run-shell "~/.config/tmux/scripts/workmux_dashboard.sh" } \
    { switch-client -t = }
bind-key -N "Workmux | Toggle the agent dashboard" W \
  run-shell "~/.config/tmux/scripts/workmux_dashboard.sh"
# The dashboard lives in a floating pane, not a popup, so a second click can
# close it (a popup is modal and swallows clicks outside itself). Close it on
# detach so tmux-resurrect never saves a floating pane it cannot restore.
set-hook -g client-detached 'run-shell -b "~/.config/tmux/scripts/workmux_dashboard.sh --close ; ~/.config/tmux/scripts/nvim-scratch-toggle close"'
bind-key -N "Workmux | Toggle the agent status sidebar" C-w run-shell "workmux sidebar"
# The sidebar adds a pane to every window; tmux-resurrect saves those panes and
# continuum restores them as dead empty shells. This hook removes those leftover
# columns once after a restore (only while no live sidebar is active) so restored
# sessions don't keep stray sidebar splits. See scripts/sidebar_cleanup.sh.
set-hook -g client-attached 'run-shell -b "~/.config/tmux/scripts/sidebar_cleanup.sh"'

# @TODO: check https://github.com/fcsonline/tmux-thumbs

# ── Scratchpad (nvim server) ──────────────────────────────
# A persistent headless nvim server (~/.config/runtime/scripts/nvim-scratch)
# is attached as a UI client by scripts/nvim-scratch-toggle, which owns the
# floating-pane/popup presentation (NVIM_SCRATCH_SURFACE, NVIM_SCRATCH_SIZE)
# and runs `nvim-scratch attach NAME` in the foreground of that pane — never
# a raw `nvim --server ... --remote-ui`, so tmux-resurrect
# (@resurrect-strategy-nvim 'session') restores the wrapper, not a dead
# socket reference, after a reboot. The server outlives the tmux server, so
# closing the pane detaches rather than quits; `:q` inside the client WOULD
# quit it, `:detach` does not. `nvim-scratch` is resolved via PATH, never a
# directory path, so the service script can move within runtime without
# breaking this binding.
bind-key -N "Utilities | Toggle the nvim scratchpad" e run-shell "~/.config/tmux/scripts/nvim-scratch-toggle toggle"

# ── Screensaver ───────────────────────────────────────────
set -ag status-right '#(~/.config/tmux/screensaver/check.sh)'
bind-key -N "Utilities | Launch the matrix screensaver" Escape new-window -n matrix "~/.config/tmux/screensaver/start.sh"

# ── TPM (keep last) ──────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

# ── Help notes for plugin keys ────────────────────────────
# Re-declared AFTER tpm so the -N notes survive plugin loading. These restate
# the plugins' own bindings verbatim; keep them in sync if a plugin changes.
bind-key -N "Persistence | Save the tmux environment" C-s run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"
bind-key -N "Persistence | Restore the tmux environment" C-r run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh"
bind-key -N "Utilities | Toggle the floating terminal" f run-shell "~/.config/tmux/plugins/tmux-floax/scripts/floax.sh"
bind-key -N "Copy mode | Copy the command line to the clipboard" y run-shell -b "~/.config/tmux/plugins/tmux-yank/scripts/copy_line.sh"
bind-key -N "Copy mode | Copy the working directory to the clipboard" Y run-shell -b "~/.config/tmux/plugins/tmux-yank/scripts/copy_pane_pwd.sh"
bind-key -N "Plugins | Install plugins (TPM)" I run-shell "~/.tmux/plugins/tpm/bindings/install_plugins"
bind-key -N "Plugins | Update plugins (TPM)" U run-shell "~/.tmux/plugins/tpm/bindings/update_plugins"
bind-key -N "Plugins | Remove unused plugins (TPM)" M-u run-shell "~/.tmux/plugins/tpm/bindings/clean_plugins"
